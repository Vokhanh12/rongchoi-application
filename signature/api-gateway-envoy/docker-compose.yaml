version: "3.8"
services:
  envoy:
    image: envoyproxy/envoy:v1.24.2
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "9901:9901"  # API Gateway
      - "10000:10000"  # Envoy Admin
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"